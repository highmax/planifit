<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Planifit - Iniciar Sesión</title>

              "inverse-primary": "#416900",
              "secondary": "#adc6ff",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .geometric-bg {
            background-image: radial-gradient(circle at 2px 2px, rgba(145, 219, 42, 0.05) 1px, transparent 0);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col geometric-bg">
<!-- TopAppBar Suppressed per Destination Rule (Transactional) -->
<main class="flex-grow flex items-center justify-center p-6">
<div class="w-full max-w-[420px] space-y-8">
<!-- Logo Section -->
<div class="text-center">
<h1 class="font-headline text-4xl font-black text-primary tracking-tighter">PLANIFIT</h1>
<p class="mt-4 font-headline text-2xl font-bold text-on-surface tracking-tight">Inicia sesión en tu cuenta</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-high p-8 rounded-xl shadow-2xl border border-outline-variant/10">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="tu@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="block font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant">Contraseña</label>
<a class="text-[11px] font-semibold text-energetic-blue hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg py-3 pl-10 pr-12 text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-bold py-4 rounded-lg flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-95 transition-all shadow-lg shadow-primary-container/10" type="submit">
                        Iniciar sesión
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Separator -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-label">
<span class="bg-surface-container-high px-4 text-on-surface-variant">o continúa con</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full bg-transparent border border-outline-variant/30 text-on-surface py-3 rounded-lg font-semibold flex items-center justify-center gap-3 hover:bg-surface-bright transition-colors">
<img alt="" class="w-5 h-5" data-alt="Google logo icon for social login" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVCLJKxD-rLFqzfQICWJh1yhPMSATgz4Yp8nvvyN7qN0VjayqiOsj9X156xOmSY54pWqN-QuYyGS-GMVtHSab5x-QVut_hicRNVRkAis5f3ar-zjWhxU1No6QnOeUn5w1CYx8s8X5J_Dt1wrHpz0UCDnCQ6PrtUJ0jNiyS-K72S4pBJUFtSiquhsN44lek6IbMgkBbymcGlnD7wdIm7cSCeUH3ohmIhCfW2aW98ipGwM-zikKC3_I2I4UyxA-P1PJXaUewH7oTHuY"/>
                    Continuar con Google
                </button>
</div>
<!-- Footer Link -->
<p class="text-center text-on-surface-variant font-medium">
                ¿No tienes cuenta? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Regístrate</a>
</p>
</div>
</main>
<!-- Footer Component -->
<footer class="flex flex-col items-center justify-center gap-4 w-full py-8 opacity-80">
<div class="flex gap-6">
<a class="font-['Inter'] text-xs uppercase tracking-widest text-slate-500 hover:text-white transition-opacity" href="#">Privacy Policy</a>
<a class="font-['Inter'] text-xs uppercase tracking-widest text-slate-500 hover:text-white transition-opacity" href="#">Terms of Service</a>
<a class="font-['Inter'] text-xs uppercase tracking-widest text-slate-500 hover:text-white transition-opacity" href="#">Support</a>
</div>
<p class="font-['Inter'] text-xs uppercase tracking-widest text-slate-500">© 2024 Planifit. Kinetic Precision Engineering.</p>
</footer>
</body></html>
